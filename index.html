<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>AmanJot Singh Slach — Property Management Accountant</title>
<link rel="icon" type="image/png" href="profile.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ══════════════════════════════
   TOKENS
══════════════════════════════ */
:root {
  --ink:    #0A0A0A;
  --ink-2:  #111111;
  --ink-3:  #1A1A1A;
  --paper:  #F2EDE4;
  --paper-2:#EAE4D9;
  --gold:   #C9A84C;
  --gold-lt:#E2C87A;
  --gold-dk:#9A7A2E;
  --gold-dim:rgba(201,168,76,.10);
  --muted:  #6B6560;
  --muted-2:#8A847D;
  --border: rgba(201,168,76,.18);
  --bs:     rgba(242,237,228,.07);
  --fd:'Playfair Display',Georgia,serif;
  --fu:'Syne',sans-serif;
  --fm:'DM Mono',monospace;
}

/* ══════════════════════════════
   RESET
══════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;}
body{background:var(--ink);color:var(--paper);font-family:var(--fu);overflow-x:hidden;}

/* ── GRAIN ── */
.grain{position:fixed;inset:-50%;width:200%;height:200%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity:.03;pointer-events:none;z-index:9000;animation:grain .5s steps(2) infinite;}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,-3%)}50%{transform:translate(3%,0)}75%{transform:translate(0,3%)}100%{transform:translate(-3%,3%)}}

/* ── PROGRESS ── */
#prog{position:fixed;top:0;left:0;height:2px;z-index:8000;width:0%;
  background:linear-gradient(90deg,var(--gold-dk),var(--gold),var(--gold-lt));pointer-events:none;}

/* ── LOADER ── */
.loader{position:fixed;inset:0;background:var(--ink);z-index:7500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;
  transition:opacity .6s,visibility .6s;}
.loader.gone{opacity:0;visibility:hidden;pointer-events:none;}
.loader-name{font-family:var(--fd);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;color:var(--paper);}
.loader-name span{color:var(--gold);font-style:italic;}
.loader-bar{width:160px;height:1px;background:var(--ink-3);position:relative;overflow:hidden;}
.loader-bar::after{content:'';position:absolute;left:-100%;top:0;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:lsweep 1.4s ease .2s forwards;}
@keyframes lsweep{0%{left:-100%}100%{left:200%}}
.loader-sub{font-family:var(--fm);font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:600;height:58px;
  display:flex;align-items:center;padding:0 2.5rem;
  background:rgba(10,10,10,.93);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bs);justify-content:space-between;}
.nw{font-family:var(--fd);font-size:.92rem;font-weight:700;color:var(--paper);
  text-decoration:none;display:flex;align-items:center;gap:.5rem;}
.nb{width:26px;height:26px;background:var(--gold);border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:.66rem;font-weight:800;color:var(--ink);font-family:var(--fu);flex-shrink:0;}
.nl{display:flex;align-items:center;gap:2rem;}
.nl a{color:var(--paper);text-decoration:none;font-size:.73rem;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;opacity:.5;transition:opacity .2s;}
.nl a:hover,.nl a.active{opacity:1;}
.nl a.cta{background:var(--gold);color:var(--ink)!important;padding:.38rem 1.1rem;
  border-radius:4px;opacity:1!important;font-weight:700!important;}
.nh{display:none;background:none;border:none;color:var(--paper);font-size:1.1rem;padding:.3rem;}
/* Mobile panel */
.mp{display:none;position:fixed;inset:0;background:var(--ink-2);z-index:590;
  flex-direction:column;justify-content:center;align-items:center;gap:1.4rem;padding:2rem;}
.mp.open{display:flex;}
.mp a{font-family:var(--fd);font-size:clamp(1.6rem,5vw,2.4rem);font-weight:700;
  color:var(--paper);text-decoration:none;border-bottom:1px solid var(--bs);
  width:100%;text-align:center;padding-bottom:.9rem;transition:color .2s;}
.mp a:last-child{border-bottom:none;}
.mp a:hover{color:var(--gold);}
.mc{position:absolute;top:1.2rem;right:1.2rem;background:none;border:none;color:var(--paper);font-size:1.2rem;}
@media(max-width:768px){.nl{display:none;}.nh{display:block;}nav{padding:0 1.2rem;}}

/* ── UTILITY ── */
.s-label{font-family:var(--fm);font-size:.6rem;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);display:flex;align-items:center;gap:.7rem;margin-bottom:.85rem;}
.s-label::after{content:'';flex:1;max-width:32px;height:1px;background:var(--gold);opacity:.4;}
.s-label.dk{color:var(--gold-dk);}.s-label.dk::after{background:var(--gold-dk);}
.s-title{font-family:var(--fd);font-size:clamp(1.8rem,3.2vw,3rem);font-weight:700;line-height:1.08;letter-spacing:-.6px;}
.s-title em{font-style:italic;color:var(--gold);}
.s-title.op{color:var(--ink);}.s-title.op em{color:var(--gold-dk);}
/* Reveal */
.rv{opacity:0;transform:translateY(22px);
  transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1);}
.rv.up{opacity:1;transform:translateY(0);}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}.d4{transition-delay:.32s}
/* Buttons */
.btn-g{background:var(--gold);color:var(--ink);padding:.72rem 1.7rem;border-radius:4px;
  font-size:.76rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;
  transition:background .2s,transform .15s;font-family:var(--fu);}
.btn-g:hover{background:var(--gold-lt);transform:translateY(-2px);}
.btn-o{border:1px solid rgba(242,237,228,.2);color:var(--paper);padding:.7rem 1.5rem;border-radius:4px;
  font-size:.76rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;
  transition:border-color .2s,color .2s;font-family:var(--fu);}
.btn-o:hover{border-color:var(--gold);color:var(--gold);}
/* Page explore link */
.xlink{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--fm);
  font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;
  text-decoration:none;transition:gap .2s;}
.xlink.lt{color:var(--gold-lt);}.xlink.lt:hover{gap:.7rem;}
.xlink.dk{color:var(--gold-dk);}.xlink.dk:hover{gap:.7rem;}

/* ══════════════════════════════
   HERO
══════════════════════════════ */
#hero{padding-top:58px;display:grid;grid-template-columns:1fr 1fr;
  min-height:100svh;overflow:hidden;}
.hl{background:var(--ink);display:flex;flex-direction:column;
  justify-content:flex-end;padding:3rem 3.5rem 4rem;
  position:relative;z-index:2;overflow:hidden;}
.hwm{position:absolute;bottom:-2rem;left:-1rem;font-family:var(--fd);
  font-size:clamp(7rem,14vw,16rem);font-weight:900;color:transparent;
  -webkit-text-stroke:1px rgba(201,168,76,.05);pointer-events:none;user-select:none;line-height:1;}
.htag{font-family:var(--fm);font-size:.62rem;letter-spacing:3px;color:var(--gold);
  text-transform:uppercase;display:flex;align-items:center;gap:.7rem;
  margin-bottom:1.3rem;position:relative;z-index:1;}
.htag::before{content:'';width:22px;height:1px;background:var(--gold);flex-shrink:0;}
.hname{font-family:var(--fd);font-size:clamp(2.4rem,4.2vw,4.8rem);font-weight:900;
  line-height:.92;letter-spacing:-2px;color:var(--paper);margin-bottom:1.5rem;
  position:relative;z-index:1;}
.hname em{font-style:italic;color:var(--gold);}
.havail{display:inline-flex;align-items:center;gap:.5rem;background:var(--gold-dim);
  border:1px solid var(--border);border-radius:999px;padding:.35rem .9rem;
  font-family:var(--fm);font-size:.6rem;letter-spacing:.8px;text-transform:uppercase;
  color:var(--gold-lt);margin-bottom:1.8rem;width:fit-content;position:relative;z-index:1;}
.pulse{width:6px;height:6px;background:#4DCC7A;border-radius:50%;flex-shrink:0;animation:pg 2s infinite;}
@keyframes pg{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(77,204,122,.5)}50%{opacity:.6;box-shadow:0 0 0 5px rgba(77,204,122,0)}}
.hctas{display:flex;gap:.7rem;flex-wrap:wrap;position:relative;z-index:1;}
/* hero right — photo */
.hr{position:relative;overflow:hidden;}
.hphoto{width:100%;height:100%;object-fit:cover;object-position:top center;
  filter:grayscale(10%) contrast(1.06);transform:scale(1.03);transition:transform 9s ease;}
.hphoto.loaded{transform:scale(1);}
.hov{position:absolute;inset:0;
  background:linear-gradient(to right,var(--ink) 0%,transparent 28%),
             linear-gradient(to top,rgba(10,10,10,.65) 0%,transparent 55%);z-index:1;}
.hli{position:absolute;top:1.2rem;right:1.2rem;z-index:3;
  display:inline-flex;align-items:center;gap:.42rem;
  background:#0A66C2;color:#fff;padding:.45rem .9rem;border-radius:6px;
  font-size:.72rem;font-weight:700;text-decoration:none;
  box-shadow:0 4px 14px rgba(10,102,194,.45);transition:transform .2s,background .2s;}
.hli:hover{transform:translateY(-2px);background:#0077B5;}
.hstamp{position:absolute;right:1.1rem;top:50%;transform:translateY(-50%) rotate(90deg);
  font-family:var(--fm);font-size:.54rem;letter-spacing:4px;text-transform:uppercase;
  color:rgba(242,237,228,.22);z-index:2;white-space:nowrap;}
.hstats{position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%);
  display:flex;gap:.8rem;z-index:2;}
.hsc{text-align:center;background:rgba(10,10,10,.72);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:8px;padding:.6rem .9rem;white-space:nowrap;}
.hsc .hn{font-family:var(--fd);font-size:1.4rem;font-weight:700;color:var(--gold);
  line-height:1;display:block;}
.hsc .hl2{font-family:var(--fm);font-size:.54rem;letter-spacing:.8px;
  text-transform:uppercase;color:rgba(242,237,228,.42);}
@media(max-width:900px){
  #hero{grid-template-columns:1fr;}
  .hr{position:absolute;inset:0;z-index:0;}
  .hl{background:transparent;padding:5rem 1.5rem 3.5rem;justify-content:flex-end;z-index:1;}
  .hl::before{content:'';position:absolute;inset:0;
    background:linear-gradient(to top,rgba(10,10,10,.96) 45%,rgba(10,10,10,.3) 100%);z-index:-1;}
  .hname{font-size:clamp(2.2rem,8vw,3.8rem);}
  .hstats{display:none;}
  .hli{top:68px;}
}

/* ══════════════════════════════
   MARQUEE
══════════════════════════════ */
.mqw{overflow:hidden;background:var(--gold);padding:.6rem 0;}
.mqt{display:flex;width:max-content;animation:mq 28s linear infinite;}
.mqt:hover{animation-play-state:paused;}
@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.mqi{display:inline-flex;align-items:center;gap:.8rem;padding:0 1.8rem;
  font-size:.63rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--ink);font-family:var(--fu);white-space:nowrap;}
.mqs{font-size:.38rem;opacity:.35;}

/* ══════════════════════════════
   ABOUT / STATS SPLIT
══════════════════════════════ */
#about{display:grid;grid-template-columns:1fr 1fr;}
.al{background:var(--paper);color:var(--ink);
  padding:clamp(3rem,6vw,5.5rem) clamp(2rem,4vw,4.5rem);
  position:relative;overflow:hidden;}
.al::before{content:'01';position:absolute;top:-1rem;right:-1rem;
  font-family:var(--fd);font-size:11rem;font-weight:900;color:transparent;
  -webkit-text-stroke:1px rgba(10,10,10,.04);pointer-events:none;line-height:1;}
.abody{margin-top:1.4rem;font-size:clamp(.86rem,1vw,.97rem);line-height:1.78;
  color:#3A3530;max-width:440px;}
.abody p{margin-bottom:.9rem;}.abody p:last-child{margin-bottom:0;}
.gd{color:var(--gold-dk);font-weight:700;}
.aquote{margin-top:1.8rem;border-left:3px solid var(--gold-dk);padding-left:1.2rem;
  font-family:var(--fd);font-size:1rem;font-style:italic;color:var(--ink-2);line-height:1.5;}
.ar{background:var(--ink-2);padding:clamp(3rem,6vw,5.5rem) clamp(2rem,4vw,4.5rem);
  display:flex;flex-direction:column;justify-content:center;gap:1.8rem;}
.sr{border-bottom:1px solid var(--bs);padding-bottom:1.6rem;}
.sr:last-child{border-bottom:none;padding-bottom:0;}
.sbig{font-family:var(--fd);font-size:clamp(2.5rem,4.5vw,4rem);font-weight:900;
  color:var(--gold);line-height:.88;display:block;letter-spacing:-2px;}
.sdesc{font-size:.82rem;color:var(--muted-2);margin-top:.4rem;line-height:1.5;}
.ssub{font-family:var(--fm);font-size:.58rem;color:var(--muted);letter-spacing:1px;margin-top:.15rem;display:block;}
@media(max-width:860px){#about{grid-template-columns:1fr;}.al,.ar{padding:3rem 1.5rem;}}

/* ══════════════════════════════
   EXPERTISE + TIMELINE — 2-COL SPLIT
══════════════════════════════ */
#exp-tl{display:grid;grid-template-columns:1fr 1fr;min-height:80vh;}

/* ── LEFT: Expertise (dark) ── */
.exp-left{
  background:var(--ink-3);
  padding:clamp(3rem,6vw,5.5rem) clamp(2rem,4vw,4.5rem);
  display:flex;flex-direction:column;
  border-right:1px solid var(--bs);
  position:relative;overflow:hidden;
}
.exp-left::before{
  content:'02';position:absolute;top:-1rem;right:-1rem;
  font-family:var(--fd);font-size:11rem;font-weight:900;color:transparent;
  -webkit-text-stroke:1px rgba(201,168,76,.04);pointer-events:none;line-height:1;
}
.exp-cards{
  margin-top:2rem;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:var(--bs);
  border:1px solid var(--bs);
  border-radius:10px;
  overflow:hidden;
  flex:1;
}
.ec{
  background:var(--ink-2);
  padding:1.5rem 1.4rem;
  display:flex;flex-direction:column;gap:.6rem;
  position:relative;overflow:hidden;
  transition:background .25s;
}
.ec::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0;transition:opacity .3s;
}
.ec:hover{background:var(--ink-3);}
.ec:hover::before{opacity:1;}
.ec:hover .ec-title{color:var(--gold-lt);}
.ec-num{font-family:var(--fm);font-size:.56rem;color:var(--muted);letter-spacing:1.5px;}
.ec-icon{color:var(--gold);font-size:1.1rem;}
.ec-title{font-family:var(--fd);font-size:.98rem;font-weight:700;color:var(--paper);
  line-height:1.2;transition:color .25s;}
.ec-body{font-size:.75rem;color:var(--muted-2);line-height:1.55;margin-top:.1rem;}

/* ── RIGHT: Timeline (paper) ── */
.tl-right{
  background:var(--paper);color:var(--ink);
  padding:clamp(3rem,6vw,5.5rem) clamp(2rem,4vw,4.5rem);
  position:relative;overflow:hidden;
}
.tl-right::before{
  content:'03';position:absolute;top:-1rem;right:-1rem;
  font-family:var(--fd);font-size:11rem;font-weight:900;color:transparent;
  -webkit-text-stroke:1px rgba(10,10,10,.04);pointer-events:none;line-height:1;
}
.tlg{margin-top:2rem;position:relative;}
.tlg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;
  background:linear-gradient(to bottom,var(--gold-dk),rgba(154,122,46,.06));}
.tli{padding:1.8rem 0 1.8rem 2rem;border-bottom:1px solid rgba(10,10,10,.08);
  position:relative;}
.tli:last-child{border-bottom:none;padding-bottom:.5rem;}
.tldot{position:absolute;left:-4.5px;top:2.3rem;width:10px;height:10px;
  border-radius:50%;background:var(--gold-dk);
  box-shadow:0 0 0 4px rgba(154,122,46,.15);}
.tlperiod{font-family:var(--fm);font-size:.6rem;letter-spacing:.8px;
  color:var(--gold-dk);text-transform:uppercase;margin-bottom:.35rem;line-height:1.5;}
.tlrole-btn{background:none;border:none;padding:0;text-align:left;
  display:inline-flex;align-items:center;gap:.45rem;margin-bottom:.25rem;cursor:pointer;}
.tlrole-btn:hover .tlrole{color:var(--gold-dk);}
.tlrole-btn:hover .tlplus{opacity:1;}
.tlrole{font-family:var(--fd);font-size:clamp(.95rem,1.6vw,1.3rem);font-weight:700;
  color:var(--ink);letter-spacing:-.1px;transition:color .2s;}
.tlplus{color:var(--gold-dk);font-size:.65rem;opacity:.45;transition:opacity .2s;}
.tlhint{font-family:var(--fm);font-size:.57rem;color:rgba(154,122,46,.45);
  font-style:italic;margin-bottom:.4rem;}
.tlco{font-size:.76rem;color:var(--muted);margin-bottom:.6rem;}
.tlkeys{display:flex;flex-wrap:wrap;gap:.3rem;}
.tlkey{display:inline-flex;align-items:center;gap:.28rem;
  background:rgba(154,122,46,.08);border:1px solid rgba(154,122,46,.2);
  border-radius:4px;padding:.2rem .55rem;font-size:.66rem;
  color:var(--gold-dk);font-weight:600;}
.tlkey i{font-size:.48rem;}

/* Mobile: stack exp + tl vertically */
@media(max-width:860px){
  #exp-tl{grid-template-columns:1fr;}
  .exp-left,.tl-right{padding:3rem 1.5rem;border-right:none;}
  .exp-cards{grid-template-columns:1fr 1fr;}
}
@media(max-width:440px){.exp-cards{grid-template-columns:1fr;}}

/* ══════════════════════════════
   ROLE POPUP
══════════════════════════════ */
.rolo{position:fixed;inset:0;z-index:9500;display:none;
  align-items:center;justify-content:center;padding:1.2rem;}
.rolo.open{display:flex;}
.robd{position:absolute;inset:0;background:rgba(10,10,10,.78);backdrop-filter:blur(6px);}
.robx{position:relative;z-index:1;background:var(--ink-2);
  border:1px solid rgba(201,168,76,.28);border-radius:14px;
  padding:1.8rem 2rem;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;
  box-shadow:0 28px 72px rgba(0,0,0,.8);
  animation:pu .3s cubic-bezier(.22,1,.36,1);}
@keyframes pu{from{opacity:0;transform:scale(.9) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
.robh{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.2rem;}
.robt{font-family:var(--fd);font-size:1.3rem;font-weight:700;color:var(--gold-lt);line-height:1.2;}
.rocl{width:28px;height:28px;border-radius:50%;border:1px solid var(--bs);
  background:rgba(255,255,255,.05);color:var(--muted-2);font-size:.75rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .2s,color .2s;cursor:pointer;}
.rocl:hover{background:rgba(201,168,76,.15);color:var(--gold);}
.robco{font-size:.76rem;color:var(--muted-2);margin-bottom:.15rem;}
.robdate{font-family:var(--fm);font-size:.6rem;color:var(--gold);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:1.1rem;}
.robdiv{width:34px;height:1.5px;background:var(--gold);opacity:.4;margin-bottom:1.1rem;border-radius:2px;}
.robul{list-style:none;display:flex;flex-direction:column;gap:.6rem;}
.robul li{font-size:.83rem;color:rgba(242,237,228,.82);line-height:1.62;
  padding-left:1.2rem;position:relative;}
.robul li::before{content:'→';position:absolute;left:0;color:var(--gold);font-size:.65rem;top:.18rem;}
.robx::-webkit-scrollbar{width:3px;}
.robx::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:2px;}

/* ══════════════════════════════
   TOOLS BENTO
══════════════════════════════ */
#tools{background:var(--ink);padding:clamp(3rem,6vw,5.5rem) clamp(1.5rem,4vw,4.5rem);}
.tbt{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:2.2rem;
  background:var(--bs);border:1px solid var(--bs);border-radius:10px;overflow:hidden;}
.tc{background:var(--ink-3);padding:1.3rem 1.4rem;display:flex;
  flex-direction:column;gap:.45rem;transition:background .25s;}
.tc:hover{background:var(--ink-2);}
.tci{width:30px;height:30px;background:var(--gold-dim);border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);font-size:.82rem;flex-shrink:0;}
.tcn{font-size:.82rem;font-weight:600;color:var(--paper);line-height:1.2;}
.tct{font-family:var(--fm);font-size:.56rem;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
.tc.feat{grid-column:span 2;background:rgba(201,168,76,.07);border:1px solid var(--border);}
.tc
